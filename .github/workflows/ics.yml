name: build-ics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/build-ics.js', 'data.js']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-ics.js
      - name: commit if changed
        run: |
          git config user.name "mofet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet -- '*.ics'; then echo "no change"; else git commit -m "עדכון קובצי ICS" && git push; fi
