<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח שנה · תוכנית מופת · ישיבת בני עקיבא חדרה</title>
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5a8a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לוח מופת">
<meta name="description" content="לוח שנה, מערכת שעות, מבחנים וחופשות – תוכנית מופת">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb;--card:#fff;--ink:#1b1f3b;--mute:#6b7194;--line:#e4e6f2;--soft:#eef0fa;
  --brand:#1f5a8a;--brand2:#2e8fb5;--accent:#8aa33a;--ok:#059669;--bad:#dc2626;
  --shadow:0 1px 2px rgba(27,31,59,.06),0 8px 24px rgba(27,31,59,.07);
  --r:16px;
  --c-exam:#dc2626;--c-quiz:#ea580c;--c-hw:#0891b2;--c-trip:#059669;--c-event:#9333ea;--c-parents:#2563eb;--c-vac:#0d9488;--c-other:#64748b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1224;--card:#181c36;--ink:#eceefb;--mute:#9aa0c8;--line:#2a2f52;--soft:#20254a;--brand:#7cc4e6;--brand2:#5bb7d5;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
#app{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 4px 14px}
.logo{width:78px;height:78px;border-radius:20px;background:#fff;object-fit:contain;padding:3px;box-shadow:var(--shadow)}
.bells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.bell{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.bell b{min-width:96px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.bell.brk{opacity:.7;font-size:13px}
.bell.pray{background:color-mix(in srgb,var(--accent) 22%,var(--soft))}
.bell.now{outline:2.5px solid var(--brand);font-weight:700}
.fri{font-size:11.5px;font-weight:700;color:var(--accent)}
.ttl{flex:1;min-width:180px}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.ttl small{color:var(--mute);font-size:13px}
.chip,.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover,.chip:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 4px 14px rgba(31,90,138,.35)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--mute);font-weight:600}
.badge.staff{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.badge.staff{background:#14532d;color:#bbf7d0}}
.banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
@media (prefers-color-scheme:dark){.banner{background:#422006;color:#fde68a}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.today{background:linear-gradient(135deg,#143f66 0%,#1f6f9c 55%,#6f9a3a 130%);color:#fff;position:relative;overflow:hidden}
.today::after{content:'';position:absolute;inset:auto auto -60px -60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.today .lbl{opacity:.85;font-size:13px;font-weight:600}
.today .hb{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0}
.today .gr{font-size:16px;opacity:.95}
.today .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.tag.on{background:#fff;color:#143f66}
.today .lessons{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.today .les{background:rgba(255,255,255,.16);border-radius:10px;padding:4px 9px;font-size:13px}
.up h3,.sec h3{margin:0 0 10px;font-size:15px}
.upi{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.upi:first-of-type{border-top:0}
.upi .dot{width:10px;height:10px;border-radius:50%;flex:none}
.upi .t{flex:1;font-weight:600;font-size:14.5px}
.upi .t small{display:block;font-weight:400;color:var(--mute)}
.upi .cd{font-size:12.5px;color:var(--mute);white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.cls{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.cls i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cls.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:10px;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.nav h2{margin:0;font-size:20px;flex:1;min-width:160px}
.nav h2 small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
.ib:hover{border-color:var(--brand);color:var(--brand)}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mh{background:var(--soft);text-align:center;padding:8px 2px;font-size:13px;font-weight:700;color:var(--mute)}
.cell{background:var(--card);min-height:104px;padding:5px 6px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:hover{background:var(--soft)}
.cell.out{opacity:.45}
.cell.off{background:repeating-linear-gradient(135deg,var(--card),var(--card) 8px,var(--soft) 8px,var(--soft) 16px)}
.cell.sab{background:var(--soft)}
.cell.today{outline:2.5px solid var(--brand);outline-offset:-2.5px;color:inherit}
.cell .n{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .g{font-weight:800;font-size:15px}
.cell .h{font-size:11.5px;color:var(--mute);font-weight:500}
.cell .hol{font-size:11px;font-weight:700;color:var(--c-vac);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .hol.memorial{color:#475569}.cell .hol.fast{color:#b45309}.cell .hol.rc{color:var(--mute);font-weight:600}.cell .hol.holiday{color:#7c3aed}
.ev{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:11px;color:var(--mute);font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
@media(max-width:700px){
  .cell{min-height:62px;padding:4px 3px;align-items:center}
  .cell .n{flex-direction:column;align-items:center;gap:0}
  .cell .h{font-size:10px}
  .cell .hol,.cell .ev,.cell .more{display:none}
  .dots{display:flex;justify-content:center}
  .cell .hdot{display:block}
}
.hdot{display:none;width:7px;height:7px;border-radius:2px;background:var(--c-vac)}
/* week */
.wgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media(max-width:900px){.wgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wgrid{grid-template-columns:1fr}}
.wday{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-height:190px;border-top:4px solid var(--brand)}
.wday.off{border-top-color:var(--c-vac);background:linear-gradient(var(--card),var(--soft))}
.wday.today{outline:2px solid var(--brand)}
.wday .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.wday .wh b{font-size:16px}
.wday .wh small{color:var(--mute)}
.wl{font-size:13px;padding:5px 8px;border-radius:8px;background:var(--soft);margin-bottom:5px;display:flex;gap:6px;align-items:baseline}
.wl b{min-width:18px;color:var(--mute);font-weight:700}
.wl small{color:var(--mute);margin-inline-start:auto}
.wev{font-size:13px;padding:6px 9px;border-radius:9px;color:#fff;margin-bottom:5px;cursor:pointer;font-weight:600}
.wev small{display:block;font-weight:400;opacity:.9}
.whol{font-size:12.5px;font-weight:700;color:var(--c-vac);margin-bottom:6px}
/* timetable */
.ttw{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
.tt th{font-size:13.5px;color:var(--mute);font-weight:700;padding:4px}
.tt th.per{text-align:center;width:84px;font-weight:600;line-height:1.2}
.tt th.per b{color:var(--ink);font-size:16px;display:block}
.tt td{height:66px;border-radius:12px;vertical-align:middle;text-align:center;padding:4px;font-size:14px;background:var(--soft);min-width:96px}
.tt td.f{font-weight:700;cursor:default}
.tt td.f small{display:block;font-weight:400;font-size:12px;opacity:.85}
.tt td.edit{cursor:pointer;outline:1.5px dashed transparent}
.tt td.edit:hover{outline-color:var(--brand)}
.tt td.cur{box-shadow:0 0 0 2.5px var(--brand)}
/* lists */
.lst{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;border-inline-start:6px solid var(--brand)}
.item .db{min-width:62px;text-align:center;line-height:1.1}
.item .db b{font-size:26px;font-weight:800;display:block}
.item .db small{font-size:12px;color:var(--mute);display:block}
.item .mid{flex:1;min-width:0}
.item .mid .t{font-weight:700;font-size:16px}
.item .mid .s{font-size:13px;color:var(--mute)}
.item .cd{font-size:13px;font-weight:700;color:var(--brand);white-space:nowrap}
.mhd{margin:18px 4px 8px;font-size:14px;font-weight:800;color:var(--mute)}
.warn{background:#fff7ed;color:#9a3412;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;margin:0 0 10px}
@media (prefers-color-scheme:dark){.warn{background:#431407;color:#fdba74}}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,18,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50;backdrop-filter:blur(3px)}
.md{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);padding:22px;animation:pop .18s ease-out}
.md.wide{width:min(760px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.md h2{margin:0 0 4px;font-size:20px}
.md .sub{color:var(--mute);font-size:13.5px;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--mute);margin-top:3px}
.acts{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--bg)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:10px 0}
.kv b{color:var(--mute);font-weight:600}
.tbadge{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.steps{counter-reset:s;padding:0;list-style:none;margin:10px 0}
.steps li{counter-increment:s;padding:8px 40px 8px 0;position:relative;font-size:14.5px}
.steps li::before{content:counter(s);position:absolute;right:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
textarea.code{width:100%;height:120px;font-family:monospace;font-size:12px;direction:ltr;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl input{width:100%;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.sw{display:flex;gap:6px}
.sw i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:var(--ink)}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.ct{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ct .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--soft);flex:none}
.ct .who{flex:1;min-width:120px;line-height:1.25}
.ct .who b{display:block;font-size:15px}
.ct .who small{color:var(--mute);font-size:12.5px}
.ct .go{display:flex;gap:6px;flex-wrap:wrap}
a.btn{text-decoration:none}
.btn.wa{background:#25d366;border-color:#25d366;color:#053b1a}
.btn.wa:hover{color:#053b1a;filter:brightness(1.05)}
.foot{text-align:center;color:var(--mute);font-size:12.5px;margin-top:26px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script src="data.js"></script>
<script>
'use strict';
/* =====================================================================
   1. כלי עזר ותאריכים (עברי + לועזי)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((fromKey(key(b))-fromKey(key(a)))/864e5);
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const GM=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const WDS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const HM={'Tishri':'תשרי','Heshvan':'חשוון','Kislev':'כסלו','Tevet':'טבת','Shevat':'שבט','Adar I':'אדר א׳','Adar II':'אדר ב׳','Adar':'אדר','Nisan':'ניסן','Iyar':'אייר','Sivan':'סיוון','Tamuz':'תמוז','Av':'אב','Elul':'אלול'};

function gem(n){
  const L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let s='';for(const [v,c] of L){while(n>=v){s+=c;n-=v}}
  s=s.replace(/יה$/,'טו').replace(/יו$/,'טז');
  return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1);
}
const _hf=new Intl.DateTimeFormat('en-u-ca-hebrew-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const _hc={};
function hd(d){
  const k=key(d);if(_hc[k])return _hc[k];
  const p={};for(const x of _hf.formatToParts(d))p[x.type]=x.value;
  return _hc[k]={d:+p.day,m:p.month,y:+p.year};
}
const hYearStr=y=>gem(y%1000);
function hStr(d,o){o=o||{};const h=hd(d);let s=gem(h.d)+' ב'+(HM[h.m]||h.m);if(o.year)s+=' '+hYearStr(h.y);return s}
function hShort(d){const h=hd(d);return h.d===1?(HM[h.m]||h.m):gem(h.d)}
function gStr(d,o){o=o||{};return (o.wd?'יום '+WD[d.getDay()]+', ':'')+d.getDate()+' ב'+GM[d.getMonth()]+(o.year===false?'':' '+d.getFullYear())}

/* שנת לימודים: ספטמבר–אוגוסט. מזהה = שנה עברית (למשל 5787 = תשפ״ז) */
const schoolStartYear=d=>d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;
const heYearOfStart=sy=>hd(new Date(sy+1,5,15,12)).y;
const startOfHeYear=H=>H-3761;
const yearLabel=H=>'תשפ״ז'.length&&hYearStr(H);
function currentYearH(){const t=new Date();return heYearOfStart(t.getMonth()>=6?t.getFullYear():t.getFullYear()-1)}

/* =====================================================================
   2. חגים, חופשות וימים מיוחדים לפי הלוח העברי
   ===================================================================== */
const DEF_RULES={sukkot:true,chanukah:true,purim:true,pesach:true,shavuot:true,atzmaut:true,lagbaomer:false,summer:true};
const YI={};
function yearInfo(sy,rules){
  const ck=sy+'|'+JSON.stringify(rules);if(YI[ck])return YI[ck];
  const map={};const add=(k,o)=>{(map[k]=map[k]||[]).push(o)};
  const R=Object.assign({},DEF_RULES,rules||{});
  const end=new Date(sy+1,7,31,12);
  for(let d=new Date(sy,8,1,12);d<=end;d=addDays(d,1)){
    const h=hd(d),wd=d.getDay(),k=key(d),m=h.m,dd=h.d;
    const adar=(m==='Adar II'||m==='Adar');
    if(m==='Tishri'){
      if(dd===1)add(k,{n:'ראש השנה',t:'holiday',off:true,g:'rosh'});
      if(dd===2)add(k,{n:'ראש השנה (יום ב׳)',t:'holiday',off:true,g:'rosh'});
      if(dd===3&&wd!==6)add(k,{n:'צום גדליה',t:'fast'});
      if(dd===4&&wd===0)add(k,{n:'צום גדליה',t:'fast'});

    }

}
function dayInfo(d,rules){
  const sy=schoolStartYear(d),inf=yearInfo(sy,rules),k=key(d),items=(inf.map[k]||[]).slice();
  const mo=d.getMonth(),wd=d.getDay();
  let summer=false;
  if(inf.rules.summer&&(mo===6||mo===7))summer=true;
  if(inf.rules.summer&&mo===5&&d.getDate()===30){items.push({n:'סיום שנת הלימודים',t:'school'})}
  if(mo===8&&d.getDate()===1){items.push({n:'פתיחת שנת הלימודים',t:'school'})}
  const off=items.some(i=>i.off)||summer||wd===6;
  return {items,off,summer,shabbat:wd===6,friday:wd===5,holOff:items.some(i=>i.off)||summer};
}

function parseCsv(t){
  const rows=[];let row=[],cur='',q=false;
  t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const TYPE_BY_NAME={'מבחן':'exam','בוחן':'quiz','הגשה':'hw','הגשת עבודה':'hw','טיול':'trip','סיור':'trip','אירוע':'event','טקס':'event','אסיפה':'parents','אסיפת הורים':'parents','שיחת הורים':'parents','חופשה':'vacation','אין לימודים':'vacation','אחר':'other'};
const normName=x=>String(x||'').replace(/[׳'`"״]/g,'').replace(/\s+/g,'').trim();
function normDate(v){v=String(v||'').trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(v);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);return ''}
function eventsFromSheet(text){
  const rows=parseCsv(text).filter(r=>r.some(x=>x&&x.trim()));
  const out={};
  rows.slice(1).forEach((r,i)=>{
    const [title,type,date,end,st,en,cls,subj,place,notes]=r.map(x=>(x||'').trim());
    const d=normDate(date);if(!title||!d)return;
    const ids=cls?cls.split(/[,،;]/).map(x=>{const n=normName(x);const c=(cfg().classes||[]).find(c=>normName(c.name)===n);return c?c.id:null}).filter(Boolean):[];
    const e={id:'sh'+i,_c:'sheet',title,type:TYPE_BY_NAME[type]||'other',date,classIds:ids,subject:subj,place,notes,allDay:!st};
    const ed=normDate(end);if(ed&&ed>d)e.endDate=ed;if(st){e.start=st;e.end=en}
    out[e.id]=e;
  });
  return out;
}

function evTimes(e){
  const s=e.date,en=e.endDate&&e.endDate>=e.date?e.endDate:e.date;
  return {s,en,timed:!e.allDay&&e.start};
}
function evDetails(e){
  const cl=(e.classIds||[]).map(id=>{const c=clsById(id);return c?c.name:''}).filter(Boolean).join(', ');
  const parts=[];
  parts.push(TYPES[e.type]?TYPES[e.type].n:'');
  if(e.subject)parts.push('מקצוע: '+e.subject);
  parts.push(cl?'כיתות: '+cl:'כל הכיתות');
  parts.push('תאריך עברי: '+hStr(fromKey(e.date),{year:true}));
  if(e.notes)parts.push(e.notes);
  parts.push(cfg().program||'תוכנית מופת');
  return parts.filter(Boolean).join('\n');
}
function gcalLink(e){
  const t=evTimes(e);
  let dates;
  if(t.timed){
    const st=e.date.replace(/-/g,'')+'T'+e.start.replace(':','')+'00';
    const ed=t.en.replace(/-/g,'')+'T'+(e.end||e.start).replace(':','')+'00';
    dates=st+'/'+ed;
  }else{
    dates=e.date.replace(/-/g,'')+'/'+key(addDays(fromKey(t.en),1)).replace(/-/g,'');
  }
  const q=new URLSearchParams({action:'TEMPLATE',text:(TYPES[e.type]?TYPES[e.type].e+' ':'')+e.title,dates,ctz:'Asia/Jerusalem',details:evDetails(e)});
  if(e.place)q.set('location',e.place);
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function csvCell(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'}
function usDate(k){const a=k.split('-');return a[1]+'/'+a[2]+'/'+a[0]}
function us12(t){const a=t.split(':').map(Number);const h=a[0]%12||12;return h+':'+pad(a[1])+' '+(a[0]>=12?'PM':'AM')}
function buildCsv(opt){
  const rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location','Private']];
  const yStart=startOfHeYear(S.year);
  const from=new Date(yStart,8,1,12),to=new Date(yStart+1,7,31,12);
  const list=visibleEvents().filter(e=>e.date>=key(from)&&e.date<=key(to)&&opt.types[e.type]);
  list.sort((a,b)=>a.date.localeCompare(b.date));
  for(const e of list){
    const t=evTimes(e);
    const subj=(TYPES[e.type]?TYPES[e.type].e+' ':'')+e.title;
    if(t.timed)rows.push([subj,usDate(e.date),us12(e.start),usDate(t.en),us12(e.end||e.start),'False',evDetails(e),e.place||'','False']);
    else rows.push([subj,usDate(e.date),'',usDate(t.en),'','True',evDetails(e),e.place||'','False']);
  }
  if(opt.holidays){
    const seen={};
    for(let d=from;d<=to;d=addDays(d,1)){
      const di=dayInfo(d,rules());
      for(const it of di.items){
        if(it.t==='rc'||it.t==='school'&&false)continue;
        if(it.t==='minor'&&!opt.minor)continue;
        const k=key(d)+it.n;if(seen[k])continue;seen[k]=1;
        rows.push(['🕎 '+it.n,usDate(key(d)),'',usDate(key(d)),'','True','תאריך עברי: '+hStr(d,{year:true}),'','False']);
      }
    }
  }
  return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}

function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
const toMin=t=>{const a=String(t||'').split(':');return a.length<2?null:(+a[0])*60+(+a[1])};
function currentBell(){
  const now=new Date();if(now.getDay()>4||isOffForClass(now))return null;
  const m=nowMin();
  for(const b of cfg().bells||[]){const s=toMin(b.s),e=b.e?toMin(b.e):s+40;if(s!=null&&m>=s&&m<e)return b}
  return null;
}
function bellsHtml(){
  const B=cfg().bells||[];if(!B.length)return '';
  const cur=currentBell();
  let h='<div class="mhd">לוח צלצולים · ימים א׳–ה׳</div><div class="card"><div class="bells">';
  for(const b of B){
    h+='<div class="bell '+(b.k||'')+(cur&&cur===b?' now':'')+'"><b>'+esc(b.s)+(b.e?'–'+esc(b.e):'')+'</b><span>'+esc(b.n)+'</span></div>';
  }
  return h+'</div><div class="hint" style="margin-top:10px">יום שישי הוא יום רשות (בית מדרש שישי, בשעות הבוקר).</div></div>';
}

/* --- חודש --- */
function monthHtml(){
  const m=S.month;const first=new Date(m.getFullYear(),m.getMonth(),1,12);
  const last=new Date(m.getFullYear(),m.getMonth()+1,0,12);
  const h1=hd(first),h2=hd(last);
  const hRange=(HM[h1.m]||h1.m)+(h1.m!==h2.m?' – '+(HM[h2.m]||h2.m):'')+' '+hYearStr(h2.y);
  let h='<div class="nav"><h2>'+GM[m.getMonth()]+' '+m.getFullYear()+'<small>'+hRange+'</small></h2>';
  h+='<button class="ib" data-mon="1" title="חודש הבא">‹</button><button class="btn sm" data-mon="0">היום</button><button class="ib" data-mon="-1" title="חודש קודם">›</button>';
  if(S.isStaff)h+='<button class="btn primary sm" data-act="newev" data-date="'+key(new Date())+'">＋ אירוע</button>';
  h+='</div><div class="mgrid">';
  for(let i=0;i<7;i++)h+='<div class="mh">'+WDS[i]+'</div>';
  const start=addDays(first,-first.getDay());
  const total=Math.ceil((first.getDay()+last.getDate())/7)*7;
  const todayK=key(new Date());
  for(let i=0;i<total;i++){
    const d=addDays(start,i),k=key(d),di=dayInfo(d,rules()),evs=eventsOn(k);
    const out=d.getMonth()!==m.getMonth();
    const off=!di.shabbat&&(di.holOff||evs.some(e=>e.type==='vacation'));
    const named=di.items.filter(x=>x.t!=='school'||true);
    let cls='cell'+(out?' out':'')+(off?' off':'')+(di.shabbat?' sab':'')+(k===todayK?' today':'');
    let inner='<div class="n"><span class="g">'+d.getDate()+'</span><span class="h">'+hShort(d)+'</span></div>';
    const main=named.filter(x=>x.t!=='rc').slice(0,2);
    const rc=named.find(x=>x.t==='rc');
    for(const it of main)inner+='<div class="hol '+it.t+'">'+esc(it.n)+'</div>';
    if(rc&&!main.length)inner+='<div class="hol rc">'+esc(rc.n)+'</div>';
    if(di.summer&&d.getDate()===1&&d.getMonth()===6)inner+='<div class="hol">חופשת הקיץ</div>';
    const shown=evs.slice(0,3);
    for(const e of shown)inner+=evChipHtml(e);
    if(evs.length>3)inner+='<div class="more">+'+(evs.length-3)+' נוספים</div>';
    inner+='<div class="dots">'+(named.some(x=>x.off)?'<span class="hdot"></span>':'')+evs.slice(0,4).map(e=>'<i style="background:'+(TYPES[e.type]||TYPES.other).c+'"></i>').join('')+'</div>';
    h+='<div class="'+cls+'" data-day="'+k+'">'+inner+'</div>';
  }
  h+='</div>';
  return h;
}

/* --- מבחנים --- */
function examsHtml(){
  const todayK=key(new Date());
  const yStart=startOfHeYear(S.year);
  const lo=key(new Date(yStart,8,1)),hi=key(new Date(yStart+1,7,31));
  let list=visibleEvents().filter(e=>EXAMLIKE.includes(e.type)&&e.date>=lo&&e.date<=hi);
  const past=list.filter(e=>e.date<todayK).length;
  if(!S.showPast)list=list.filter(e=>e.date>=todayK);
  list.sort((a,b)=>a.date.localeCompare(b.date)||(a.title||'').localeCompare(b.title||'','he'));
  let h='<div class="nav"><h2>מבחנים, בחנים והגשות<small>כולל ספירה לאחור ואזהרת שבוע עמוס</small></h2>';
  h+='<button class="btn sm" data-act="togglepast">'+(S.showPast?'הסתר שהיו':'הצג גם שהיו ('+past+')')+'</button>';
  if(S.isStaff)h+='<button class="btn primary sm" data-act="newev" data-type="exam">＋ מבחן</button>';
  h+='</div>';
  if(!list.length)return h+'<div class="card empty"><b>אין מבחנים להצגה</b>'+(S.isStaff?'הוסיפו מבחן עם הכפתור למעלה.':'כשהצוות יוסיף מבחנים, הם יופיעו כאן.')+'</div>';
  // עומס שבועי
  const load={};
  for(const e of list.concat(visibleEvents().filter(e=>EXAMLIKE.includes(e.type)&&e.type!=='hw'&&!list.includes(e)))){
    if(e.type==='hw')continue;
    const d=fromKey(e.date);const wk=key(addDays(d,-d.getDay()));load[wk]=(load[wk]||0)+1;
  }
  let lastM='',lastWk='';
  h+='<div class="lst">';
  for(const e of list){
    const d=fromKey(e.date);const T=TYPES[e.type];const mk=d.getFullYear()+'-'+d.getMonth();
    const wk=key(addDays(d,-d.getDay()));
    if(mk!==lastM){h+='</div><div class="mhd">'+GM[d.getMonth()]+' '+d.getFullYear()+'</div><div class="lst">';lastM=mk}
    if(wk!==lastWk&&load[wk]>=3&&S.cls!=='all'){h+='<div class="warn">⚠️ שבוע עמוס: '+load[wk]+' מבחנים/בחנים בשבוע של '+gStr(fromKey(wk),{year:false})+'</div>';}
    lastWk=wk;
    const cd=diffDays(new Date(),d);
    const cl=(e.classIds||[]).map(id=>(clsById(id)||{}).name).filter(Boolean).join(', ')||'כל הכיתות';
    h+='<div class="item" style="border-inline-start-color:'+T.c+'" data-ev="'+esc(e.id)+'" data-c="'+esc(e._c)+'"><div class="db"><b>'+d.getDate()+'</b><small>'+WD[d.getDay()]+'</small><small>'+hShort(d)+(hd(d).d===1?'':' '+(HM[hd(d).m]||''))+'</small></div><div class="mid"><div class="t">'+T.e+' '+esc(e.title)+'</div><div class="s">'+esc(T.n)+(e.subject?' · '+esc(e.subject):'')+' · '+esc(cl)+(e.staffOnly?' · 🔒 צוות':'')+'</div></div><div class="cd">'+(cd<0?'עבר':cdText(cd))+'</div></div>';
  }
  return h+'</div>';
}

/* --- חופשות --- */
function vacHtml(){
  const sy=startOfHeYear(S.year);
  const inf=yearInfo(sy,rules());
  const groups={};
  for(const k of Object.keys(inf.map).sort()){
    for(const it of inf.map[k]){
      if(it.off&&it.g){(groups[it.g]=groups[it.g]||{n:'',ds:[]});groups[it.g].ds.push(k);groups[it.g].n=it.g}
    }
  }
  const GN={rosh:'ראש השנה',kipur:'יום כיפור',sukkot:'חופשת סוכות',chanukah:'חופשת חנוכה',purim:'פורים',pesach:'חופשת פסח',atzmaut:'יום העצמאות',lagbaomer:'ל״ג בעומר',shavuot:'חג השבועות'};
  const rows=[];
  for(const g of Object.keys(groups)){const ds=groups[g].ds;rows.push({n:GN[g]||g,a:ds[0],b:ds[ds.length-1],c:'var(--c-vac)'})}
  if(inf.rules.summer)rows.push({n:'חופשת הקיץ',a:key(new Date(sy+1,6,1)),b:key(new Date(sy+1,7,31)),c:'var(--c-quiz)'});
  const lo=key(new Date(sy,8,1)),hi=key(new Date(sy+1,7,31));
  for(const e of visibleEvents().filter(e=>e.type==='vacation'&&e.date>=lo&&e.date<=hi))rows.push({n:e.title,a:e.date,b:e.endDate&&e.endDate>=e.date?e.endDate:e.date,c:'var(--c-vac)',ev:e});
  rows.sort((a,b)=>a.a.localeCompare(b.a));
  const todayK=key(new Date());
  let h='<div class="nav"><h2>חופשות וחגים · '+hYearStr(S.year)+'<small>לפי הלוח העברי, כולל ימי זיכרון וצומות</small></h2>';
  if(S.isStaff)h+='<button class="btn primary sm" data-act="newev" data-type="vacation">＋ יום ללא לימודים</button>';
  h+='</div><div class="lst">';
  for(const r of rows){
    const a=fromKey(r.a),b=fromKey(r.b);const n=diffDays(a,b)+1;
    const range=r.a===r.b?gStr(a,{wd:true,year:false}):a.getDate()+(a.getMonth()!==b.getMonth()?' ב'+GM[a.getMonth()]:'')+' – '+b.getDate()+' ב'+GM[b.getMonth()];
    const hr=r.a===r.b?hStr(a):hStr(a)+' – '+hStr(b);
    const cd=diffDays(new Date(),a);
    h+='<div class="item" style="border-inline-start-color:'+r.c+(r.ev?'':';cursor:default')+'" '+(r.ev?'data-ev="'+esc(r.ev.id)+'" data-c="'+esc(r.ev._c)+'"':'')+'><div class="db"><b>'+a.getDate()+'</b><small>'+GM[a.getMonth()]+'</small></div><div class="mid"><div class="t">'+esc(r.n)+(r.ev?' <span class="badge">נוסף ע״י הצוות</span>':'')+'</div><div class="s">'+range+' · '+hr+(n>1?' · '+n+' ימים':'')+'</div></div><div class="cd">'+(r.b<todayK?'עבר':r.a<=todayK?'עכשיו':cdText(cd))+'</div></div>';
  }
  h+='</div>';
  // ימים מיוחדים
  const sp=[];
  for(const k of Object.keys(inf.map).sort())for(const it of inf.map[k])if(!it.off&&(it.t==='fast'||it.t==='memorial'||it.t==='minor'))sp.push({k,it});
  h+='<div class="mhd">ימים מיוחדים, ימי זיכרון וצומות (ימי לימודים רגילים)</div><div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px">';
  for(const x of sp){const d=fromKey(x.k);h+='<div style="font-size:14px"><b>'+esc(x.it.n)+'</b><div class="hint" style="margin:0">'+gStr(d,{wd:true,year:false})+' · '+hStr(d)+'</div></div>'}
  h+='</div></div>';
  return h;
}

/* --- הקרוב --- */
function agendaHtml(){
  const now=new Date();now.setHours(12,0,0,0);
  let h='<div class="nav"><h2>הקרוב ב-45 הימים הבאים<small>אירועים, מבחנים, חגים וחופשות</small></h2>';
  if(S.isStaff)h+='<button class="btn primary sm" data-act="newev" data-date="'+key(now)+'">＋ אירוע</button>';
  h+='</div><div class="lst">';
  let any=false;
  for(let i=0;i<45;i++){
    const d=addDays(now,i),k=key(d),di=dayInfo(d,rules()),evs=eventsOn(k);
    const hol=di.items.filter(x=>x.t!=='rc'&&x.t!=='school');
    if(!evs.length&&!hol.length)continue;
    any=true;
    h+='<div class="item" style="border-inline-start-color:'+(evs[0]?(TYPES[evs[0].type]||TYPES.other).c:'var(--c-vac)')+';cursor:default" data-day="'+k+'"><div class="db"><b>'+d.getDate()+'</b><small>'+WD[d.getDay()]+'</small><small>'+hStr(d)+'</small></div><div class="mid">';
    for(const it of hol)h+='<div class="t" style="color:var(--c-vac)">'+(it.off?'🏖️ ':'🕯️ ')+esc(it.n)+'</div>';
    for(const e of evs){const T=TYPES[e.type]||TYPES.other;h+='<div class="t" style="cursor:pointer" data-ev="'+esc(e.id)+'" data-c="'+esc(e._c)+'">'+T.e+' '+esc(e.title)+' <span class="s" style="font-weight:400">'+(e.start&&!e.allDay?esc(e.start)+' · ':'')+esc(T.n)+(e.subject?' · '+esc(e.subject):'')+'</span></div>'}
    h+='</div><div class="cd">'+cdText(i)+'</div></div>';
  }
  if(!any)h+='<div class="card empty"><b>אין אירועים קרובים</b>נראה שהזמן שקט. 🌿</div>';
  return h+'</div>';
}

async function saveEvent(){
  const m=$('.md');const old=m._ev||{};

  const o={title,type,date,allDay,classIds,subject:$('#f_subj',m).value.trim(),place:$('#f_place',m).value.trim(),notes:$('#f_notes',m).value.trim(),staffOnly:$('#f_staff',m).checked};

    }catch(e){dbErr(e)}

  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let h='<h2>התקנה בטלפון</h2><div class="sub">האתר יופיע כאפליקציה במסך הבית, עם הסמל של הישיבה</div>';
  h+=ios?'<div class="kv"><b>אייפון</b><span>פתחו את האתר ב-Safari, לחצו על כפתור השיתוף (ריבוע עם חץ למעלה), ובחרו "הוסף למסך הבית".</span></div>'
        :'<div class="kv"><b>אנדרואיד</b><span>פתחו את האתר ב-Chrome, לחצו על שלוש הנקודות בפינה ובחרו "התקן אפליקציה" או "הוסף למסך הבית".</span></div>';
  h+='<div class="acts"><button class="btn primary" data-act="close">הבנתי</button></div>';
  openModal(h);
}
function helpModal(){
  let h='<h2>איך זה עובד?</h2><div class="sub">לוח פתוח לצוות ולהורים, בלי הרשמה</div>';
  h+='<div class="kv"><b>כיתה</b><span>בחרו את הכיתה בשורת הכפתורים — המערכת, האירועים והמבחנים יסוננו לכיתה שלכם.</span><b>תאריכים</b><span>בכל יום מוצגים התאריך העברי והלועזי. חגים וחופשות מחושבים לפי הלוח העברי.</span><b>יומן גוגל</b><span>לחצו על אירוע ← "הוספה ליומן גוגל שלי" והוא יישמר ביומן הפרטי שלכם. את כל הלוח אפשר לייבא מקובץ בכפתור "ליומן גוגל".</span><b>פנייה לצוות</b><span>מתחת לבחירת הכיתה: מייל או וואטסאפ למחנך ולרכזת התוכנית.</span></div>';
  h+='<div class="acts"><button class="btn primary" data-act="close">הבנתי</button></div>';
  openModal(h);
}

/* =====================================================================
   7. אירועי ממשק
   ===================================================================== */
document.addEventListener('click',async ev=>{
  const t=ev.target;
  const tab=t.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;render();return}
  const cl=t.closest('[data-cls]');if(cl){S.cls=cl.dataset.cls;savePrefs();render();return}
  const mon=t.closest('[data-mon]');if(mon){const v=+mon.dataset.mon;if(v===0)S.month=new Date(new Date().getFullYear(),new Date().getMonth(),1,12);else S.month=new Date(S.month.getFullYear(),S.month.getMonth()+v,1,12);render();return}
  const wk=t.closest('[data-wk]');if(wk){const v=+wk.dataset.wk;if(v===0)S.week=addDays(new Date(),-new Date().getDay());else S.week=addDays(S.week,7*v);render();return}
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='close')closeModal();
    else if(a==='install')installApp();
    else if(a==='export')exportModal();
    else if(a==='help')helpModal();
    else if(a==='manage')manageModal();
    else if(a==='setup')setupModal();
    else if(a==='togglepast'){S.showPast=!S.showPast;render()}
    else if(a==='newev'){eventForm({date:act.dataset.date||'',type:act.dataset.type||'exam',classIds:S.cls!=='all'?[S.cls]:[]})}
    else if(a==='saveev')saveEvent();
    else if(a==='editev'){const c=act.dataset.c;eventForm((c==='staffevents'?S.staffEvents:S.events)[act.dataset.id])}
    else if(a==='delev')deleteEvent(act.dataset.id,act.dataset.c);
    else if(a==='savecell'){
      const ck=act.dataset.ck,m=$('.md');const s=$('#c_s',m).value.trim();
      if(!s){toast('נא להזין מקצוע');return}
      const val={s,t:$('#c_t',m).value.trim(),r:$('#c_r',m).value.trim()};const all=$('#c_all',m).checked;
      const p=ck.split('_')[1];
      writeCells(cur=>{if(all){for(let d=0;d<5;d++)cur[d+'_'+p]=val}else cur[ck]=val});
    }
    else if(a==='clearcell'){const ck=act.dataset.ck;writeCells(cur=>{delete cur[ck]})}
    else if(a==='dlcsv')downloadCsv();
    else if(a==='copycsv'){const t2=$('#x_out');t2.style.display='block';t2.value=buildCsv(csvOpts());t2.select();try{await navigator.clipboard.writeText(t2.value);toast('הועתק ✓ — הדביקו בקובץ והורידו כ-CSV')}catch(e){toast('סמנו והעתיקו את הטקסט')}}
    else if(a==='savesetup'){
      const m=$('.md');const prog=$('#s_prog',m).value.trim()||'תוכנית מופת';const nm=$('#s_cls',m).value.trim();
      const classes=nm?[newClassObj(nm,gradeOf(nm),S.year,$('#s_home',m).value.trim(),0)]:[];
      saveCfg({program:prog,school:$('#s_school',m).value.trim(),periods:DEF_PERIODS,rules:{},classes});
    }
    else if(a==='addclass'){
      let h='<h2>כיתה חדשה</h2><div class="sub">שנת הלימודים '+hYearStr(S.year)+'</div><div class="row2"><div class="fld"><label>שם הכיתה</label><input type="text" id="n_name" placeholder="למשל: ח׳1"></div><div class="fld"><label>מחנך/ת</label><input type="text" id="n_home"></div></div><div class="acts"><button class="btn primary" data-act="saveclass">הוספה</button><button class="btn ghost" data-act="close">ביטול</button></div>';
      openModal(h);
    }
    else if(a==='saveclass'){
      const m=$('.md');const nm=$('#n_name',m).value.trim();if(!nm){toast('נא להזין שם כיתה');return}
      const c=JSON.parse(JSON.stringify(cfg()));c.classes=c.classes||[];c.periods=c.periods||DEF_PERIODS;
      c.classes.push(newClassObj(nm,gradeOf(nm),S.year,$('#n_home',m).value.trim(),c.classes.length));
      saveCfg(c);
    }
    else if(a==='archive'){
      if(!confirm('להעביר את הכיתה לארכיון? היא תוסתר מהלוח (הנתונים נשמרים).'))return;
      const c=readManage();const x=c.classes.find(y=>y.id===act.dataset.id);if(x)x.archived=true;if(S.cls===x.id)S.cls='all';saveCfg(c);
    }
    else if(a==='savemanage')saveCfg(readManage());
    else if(a==='addper'){const c=readManage();const last=c.periods[c.periods.length-1]||{s:'14:30',e:'15:15'};c.periods.push({s:last.e,e:last.e});S.cfg=c;manageModal()}
    else if(a==='delper'){const c=readManage();if(c.periods.length>1)c.periods.pop();S.cfg=c;manageModal()}
    else if(a==='nextyear'){
      const next=S.year+1;const cur=classesOfYear(S.year);
      if(!cur.length){toast('אין כיתות להעתקה');return}
      if(classesOfYear(next).length&&!confirm('כבר קיימות כיתות בשנה '+hYearStr(next)+'. להוסיף עוד?'))return;
      const c=readManage();c.classes=c.classes||[];const copies=[];
      for(const x of cur){
        const g=gradeOf(x.name);const gi=GRADES.indexOf(g);
        if(gi<0||gi>=GRADES.length-1){continue}
        const ng=GRADES[gi+1];const nn=x.name.trim().replace(/^(יב|יא|ז|ח|ט|י)/,ng);
        const o=newClassObj(nn,ng,next,x.homeroom,c.classes.length+copies.length);o.color=x.color;o._from=x.id;copies.push(o);
      }
      const doCopyTT=confirm('להעתיק גם את מערכות השעות לכיתות החדשות?');
      for(const o of copies){const from=o._from;delete o._from;c.classes.push(o);if(doCopyTT&&S.tt[from]){const cells=S.tt[from].cells||{};queueWrite(()=>S.db.doc('tt/'+o.id).set({cells,classId:o.id}).catch(dbErr))}}
      S.year=next;savePrefs();
      await saveCfg(c);toast('נפתחה שנת '+hYearStr(next)+' עם '+copies.length+' כיתות (כיתות י״ב לא מקודמות)');
    }
    return;
  }
  const evEl=t.closest('[data-ev]');if(evEl){ev.stopPropagation();evModal(evEl.dataset.ev,evEl.dataset.c);return}
  const cell=t.closest('[data-cell]');if(cell&&S.isStaff){cellModal(cell.dataset.cell);return}
  const day=t.closest('[data-day]');if(day){dayModal(day.dataset.day);return}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='yearSel'){S.year=+ev.target.value;if(S.cls!=='all'&&!classesOfYear(S.year).some(c=>c.id===S.cls))S.cls='all';savePrefs();
    const sy=startOfHeYear(S.year);const t=new Date();const inYear=t>=new Date(sy,8,1)&&t<=new Date(sy+1,7,31);
    S.month=inYear?new Date(t.getFullYear(),t.getMonth(),1,12):new Date(sy,8,1,12);S.week=addDays(S.month,-S.month.getDay());render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
</script>
